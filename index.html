</head><body><div id="root"><main class="boot-screen" id="boot-screen"><h1>Entre potes.</h1><p id="boot-status" role="status">Ouverture de l’application…</p><button id="boot-retry" type="button">Relancer l’application</button><p>Tes cartes, tes parties et ta connexion enregistrée sont conservées.</p><noscript>Active JavaScript dans Safari pour jouer.</noscript></main></div>
<script>
(function(){
 var status=document.getElementById('boot-status');
 function stalled(){if(document.getElementById('boot-screen'))status.textContent='Le chargement est interrompu. Vérifie ta connexion puis relance l’application.';}
 window.addEventListener('error',stalled,true);
 window.setTimeout(stalled,12000);
 document.getElementById('boot-retry').onclick=function(){location.reload();};
 // Register even if the main JavaScript failed, so an older cache can recover.
 if('serviceWorker' in navigator){navigator.serviceWorker.register('/entre-potes/sw.js',{scope:'/entre-potes/',updateViaCache:'none'}).then(function(r){return r.update();}).catch(function(){});}
})();
</script></body></html>
